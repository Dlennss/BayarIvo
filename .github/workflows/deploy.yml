name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to Server
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/main'

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      BACKEND_SOURCE_DIR: pulsa-be
      FRONTEND_SOURCE_DIR: pulsa-fe
      FRONTEND_RELEASE_DIR: bayarivo/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SERVER_HOST
            SERVER_PORT
            SERVER_USER
            SERVER_SSH_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is empty. Add it in GitHub repository secrets."
              exit 1
            fi
          done
          if [ ! -f "${BACKEND_SOURCE_DIR}/go.sum" ]; then
            echo "::error::BACKEND_SOURCE_DIR must point to the backend folder in this repository, for example: pulsa-be"
            exit 1
          fi
          if [ ! -f "${FRONTEND_SOURCE_DIR}/package-lock.json" ]; then
            echo "::error::FRONTEND_SOURCE_DIR must point to the frontend folder in this repository, for example: pulsa-fe"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache-dependency-path: pulsa-be/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.1"
          cache: npm
          cache-dependency-path: pulsa-fe/package-lock.json

      - name: Build backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/backend
          cd "$BACKEND_SOURCE_DIR"
          go mod download
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../deploy/backend/bayarivo-api .

      - name: Build frontend standalone
        env:
          NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED: "true"
          NEXT_PUBLIC_SITE_URL: https://bayarivo.com
          NEXTAUTH_URL: https://bayarivo.com
          API_BASE: http://127.0.0.1:8104
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRONTEND_SOURCE_DIR"
          npm ci
          npm run lint
          npm run build
          cd ..
          rm -rf deploy/frontend
          mkdir -p deploy/frontend/.next
          cp -R "$FRONTEND_SOURCE_DIR/.next/standalone/." deploy/frontend/
          cp -R "$FRONTEND_SOURCE_DIR/.next/static" deploy/frontend/.next/static
          cp -R "$FRONTEND_SOURCE_DIR/public" deploy/frontend/public
          test -f deploy/frontend/public/bayarivo-assets/00_full_screen/dashboard_full.png
          printf '%s\n' "$GITHUB_SHA" > deploy/frontend/DEPLOY_COMMIT
          printf '%s\n' "$GITHUB_SHA" > deploy/frontend/public/deploy-version.txt

      - name: Install SSH tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rsync
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/bayarivo-deploy"
          chmod 600 "$HOME/.ssh/bayarivo-deploy"

      - name: Upload release files
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/bayarivo-deploy -o IdentitiesOnly=yes -p ${SERVER_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          BACKEND_RELEASE_DIR="bayarivo/${BACKEND_SOURCE_DIR}"

          ssh ${SSH_OPTS} "${SERVER_USER}@${SERVER_HOST}" \
            "set -e;
             mkdir -p \"\$HOME/${BACKEND_RELEASE_DIR}\";
             mkdir -p \"\$HOME/${FRONTEND_RELEASE_DIR}\""

          rsync -az --delete -e "ssh ${SSH_OPTS}" \
            deploy/frontend/ "${SERVER_USER}@${SERVER_HOST}:~/${FRONTEND_RELEASE_DIR}/"

          rsync -az -e "ssh ${SSH_OPTS}" \
            deploy/backend/bayarivo-api "${SERVER_USER}@${SERVER_HOST}:~/${BACKEND_RELEASE_DIR}/bayarivo-api"

      - name: Activate BayarIvo and verify services
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/bayarivo-deploy -o IdentitiesOnly=yes -p ${SERVER_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ssh ${SSH_OPTS} "${SERVER_USER}@${SERVER_HOST}" \
            'sudo -n /usr/local/sbin/bayarivo-activate'

      - name: Verify public release
        shell: bash
        run: |
          set -euo pipefail
          actual=$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://bayarivo.com/deploy-version.txt?commit=${GITHUB_SHA}")
          test "$actual" = "$GITHUB_SHA"

      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$HOME/.ssh/bayarivo-deploy"
